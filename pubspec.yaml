
name: carnicaja_app
description: "Sistema local de control de caja para carnicerías en Bolivia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Librerías para la base de datos local SQLite
  sqflite: ^2.3.0
  path: ^1.8.3

  # Iconos oficiales de iOS
  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  printing: ^5.14.3
  pdf: ^3.12.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true