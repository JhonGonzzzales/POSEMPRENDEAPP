<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" id="IE_STRAIGHT" />
  <meta name="description" content="POS EMPRENDE - Demo Web">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="icon" type="image/png" href="logo.png"/>

  <title>POS EMPRENDE - Demo</title>

  <style>
    body {
      background-color: #12181b;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .mobile-frame {
      width: 100%;
      max-width: 350px; 
      height: 100vh;
      max-height: 844px;
      background-color: #000;
      border-radius: 0px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 600px) {
      .mobile-frame {
        border-radius: 40px;
        border: 12px solid #2d3748;
        height: 85vh;
      }
    }

    #flutter_container {
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="mobile-frame">
    <div id="flutter_container"></div>
  </div>

  <script>
  window.addEventListener('load', function(ev) {
    _flutter.loader.loadEntrypoint({
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine({
          hostElement: document.querySelector("#flutter_container")
        }).then(function(appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
